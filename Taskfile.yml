version: '3'

tasks:
  default:
    deps:
      - install-deps
      - build

  install-deps:
    cmds:
      - pip install -r requirements.txt

  build:
    sources:
      - ppr-get.py
    cmds:
      - pyinstaller --onefile --name igor --distpath . igor.py

  clean:
    cmds:
      - rm -rf build __pycache__ *.spec

  distclean:
    deps:
      - clean
    cmds:
      - rm -rf .task igor
